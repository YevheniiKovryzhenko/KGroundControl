name: Publish platform update feed

on:
  release:
    types: [published, edited, deleted, unpublished]
  # Asset uploads do not have their own Actions event. Refresh delayed uploads too.
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: platform-update-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/update-feed
          key: update-digests-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: update-digests-
      - name: Check release selection rules
        run: python tools/release/update_feed.py --self-test
      - name: Generate feed from all stable releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/release/update_feed.py --output public/updates.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish update feed
        id: deployment
        uses: actions/deploy-pages@v4
